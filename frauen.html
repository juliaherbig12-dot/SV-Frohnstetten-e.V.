<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team | SV Frohnstetten 1925 e.V.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-white text-slate-900 font-sans leading-relaxed">

    <nav class="bg-white/95 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center h-20">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="flex items-center space-x-3 text-blue-900 font-black italic text-xl">SVF</a>
            </div>
            <div class="hidden lg:flex space-x-8 font-bold text-xs uppercase tracking-widest text-slate-600">
                <a href="index.html" class="hover:text-blue-900 transition">Startseite</a>
                <a href="index.html#fussball" class="text-blue-900 border-b-2 border-blue-900">Fußball</a>
                <a href="index.html#hallensport" class="hover:text-blue-900 transition">Hallensport</a>
                <a href="index.html#turnen" class="hover:text-blue-900 transition">Turnen</a>
            </div>
        </div>
    </nav>

    <header class="bg-blue-900 py-20 text-white">
        <div class="max-w-7xl mx-auto px-6">
            <h1 class="text-5xl md:text-7xl font-black uppercase italic tracking-tighter leading-tight">
                Aktive Damen
            </h1>
            <div class="w-24 h-2 bg-blue-500 mt-4"></div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 -mt-12 mb-20">
        
        <div class="rounded-2xl overflow-hidden shadow-2xl border-[12px] border-white bg-slate-200 aspect-video relative">
            <img src="https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&q=80&w=1600" 
                 alt="Mannschaftsfoto" class="w-full h-full object-cover">
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-16 mt-16 italic">
            <div class="space-y-10">
                <div>
                    <h3 class="text-2xl font-black uppercase mb-4 text-blue-900 italic">Training</h3>
                    <div class="p-6 bg-slate-50 rounded-2xl border-l-4 border-blue-900">
                        <p class="font-bold">Dienstag & Donnerstag</p>
                        <p class="text-slate-600">19:00 - 21:00 Uhr</p>
                    </div>
                </div>
                <div>
                    <h3 class="text-2xl font-black uppercase mb-4 text-blue-900 italic">Kontakt</h3>
                    <div class="p-6 bg-slate-50 rounded-2xl border-l-4 border-blue-900">
                        <p class="font-bold uppercase">Trainerteam</p>
                        <a href="mailto:info@svf.de" class="text-blue-600 font-bold hover:underline">info@svf.de</a>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2">
                <h3 class="text-2xl font-black uppercase mb-4 text-blue-900 italic">Spielplan & Tabelle</h3>
                <div class="bg-slate-50 rounded-2xl p-8 border-2 border-dashed border-slate-200 min-h-[400px] flex items-center justify-center">
                    <p class="text-slate-400 font-bold uppercase tracking-widest">Fussball.de Widget hier einfügen</p>
                </div>
            </div>
        </div>

        <div class="mt-20">
            <h3 class="text-3xl font-black uppercase italic mb-10 text-blue-900">Der Kader</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                <div class="bg-white rounded-xl shadow-md overflow-hidden border border-slate-100 group">
                    <div class="h-64 bg-slate-100 flex items-center justify-center relative">
                        <i class="fa-solid fa-user text-5xl text-slate-300"></i>
                    </div>
                    <div class="p-4 bg-white">
                        <p class="text-[10px] font-bold text-blue-500 uppercase">Position</p>
                        <h4 class="font-black uppercase italic text-lg leading-none">Name</h4>
                    </div>
                </div>
                </div>
        </div>
    </main>

    <footer class="bg-slate-100 py-10 text-center text-slate-400 text-[10px] font-bold uppercase tracking-widest border-t">
        SV Frohnstetten 1925 e.V. | Blau und Weiß ein Leben lang.
    </footer>

</body>
</html>
