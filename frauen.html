<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frauenfußball | SV Frohnstetten 1925 e.V.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-white text-slate-900 font-sans leading-relaxed">

    <nav class="bg-white/95 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center h-20">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-pink-600 rounded flex items-center justify-center text-white font-bold">SVF</div>
                    <span class="text-xl font-black text-pink-600 tracking-tighter uppercase italic">Frauen</span>
                </a>
            </div>
            <a href="index.html" class="text-xs font-bold uppercase tracking-widest text-slate-500 hover:text-pink-600 transition">Zurück</a>
        </div>
    </nav>

    <header class="bg-pink-600 py-20 text-white">
        <div class="max-w-7xl mx-auto px-6 text-center md:text-left">
            <h1 class="text-5xl md:text-7xl font-black uppercase italic tracking-tighter">Frauenfußball</h1>
            <p class="text-pink-100 font-bold uppercase tracking-[0.3em] mt-2">Power & Teamgeist in Blau-Weiß</p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-16">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 mb-20 italic">
            <div class="bg-slate-50 p-10 rounded-3xl border-l-8 border-pink-600">
                <h2 class="text-2xl font-black uppercase mb-4">Über uns</h2>
                <p class="text-slate-600">Unsere Damenmannschaften stehen für Leidenschaft und Erfolg. Wir suchen immer Verstärkung für unser Team!</p>
            </div>
            <div class="bg-slate-50 p-10 rounded-3xl border-l-8 border-pink-600">
                <h2 class="text-2xl font-black uppercase mb-4">Training</h2>
                <p class="font-bold">Montag & Mittwoch</p>
                <p class="text-pink-600">19:00 - 20:30 Uhr</p>
            </div>
        </div>

        <h2 class="text-3xl font-black uppercase italic mb-10 text-pink-600">Das Team</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
            <div class="bg-white rounded-xl shadow-md overflow-hidden border border-pink-100 group">
                <div class="h-64 bg-pink-50 flex items-center justify-center relative">
                    <i class="fa-solid fa-venus text-5xl text-pink-200"></i>
                </div>
                <div class="p-4">
                    <p class="text-[10px] font-bold text-pink-600 uppercase">Position</p>
                    <h4 class="font-black uppercase italic text-lg">Spielerin Name</h4>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-slate-900 py-10 text-center text-white">
        <p class="text-[10px] font-bold uppercase tracking-widest opacity-50">SV Frohnstetten Frauenfußball</p>
    </footer>
</body>
</html>
