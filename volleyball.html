<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volleyball | SV Frohnstetten 1925 e.V.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-900 font-sans leading-relaxed">

    <nav class="bg-white/95 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center h-20">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-sky-600 rounded flex items-center justify-center text-white font-bold shadow-md">SVF</div>
                    <span class="text-xl font-black text-sky-600 tracking-tighter uppercase italic">Volleyball</span>
                </a>
            </div>
            <a href="index.html" class="text-xs font-bold uppercase tracking-widest text-slate-500 hover:text-sky-600 transition">Startseite</a>
        </div>
    </nav>

    <header class="bg-sky-600 py-20 text-white">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <h1 class="text-5xl md:text-7xl font-black uppercase italic tracking-tighter">Volleyball</h1>
            <p class="text-sky-100 font-bold uppercase tracking-[0.3em] mt-2">Action in der Sporthalle</p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-16">
        <h2 class="text-3xl font-black uppercase italic mb-10 border-l-8 border-sky-600 pl-4">Unser Team</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-8">
            <div class="bg-white rounded-2xl shadow-xl overflow-hidden group border-t-4 border-sky-600 transition-transform hover:-translate-y-2">
                <div class="h-64 bg-slate-100 flex items-center justify-center relative">
                    <i class="fa-solid fa-volleyball text-5xl text-sky-100 group-hover:rotate-12 transition-transform"></i>
                </div>
                <div class="p-6">
                    <p class="text-[10px] font-bold text-sky-600 uppercase tracking-widest mb-1">Position</p>
                    <h4 class="font-black uppercase text-xl italic">Name</h4>
                </div>
            </div>
            </div>

        <div class="mt-24 bg-white p-12 rounded-3xl shadow-lg border border-slate-100">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
                <div>
                    <h3 class="text-2xl font-black uppercase italic mb-6">Trainingszeiten</h3>
                    <div class="space-y-4">
                        <div class="flex justify-between border-b pb-2">
                            <span class="font-bold">Hobby-Mixed</span>
                            <span class="text-sky-600">Mo, 20:00 Uhr</span>
                        </div>
                        <p class="text-sm text-slate-500 italic">Neue Mitspieler sind jederzeit willkommen. Komm einfach vorbei!</p>
                    </div>
                </div>
                <div>
                    <h3 class="text-2xl font-black uppercase italic mb-6">Kontakt</h3>
                    <p class="text-slate-600 mb-4">Du hast Fragen zum Volleyball beim SVF?</p>
                    <a href="mailto:volleyball@sv-frohnstetten.de" class="inline-block bg-sky-600 text-white px-8 py-3 rounded-full font-bold uppercase text-sm shadow-lg shadow-sky-600/20">Jetzt anfragen</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-20 text-center opacity-30">
        <div class="w-12 h-1 bg-sky-600 mx-auto mb-4"></div>
        <p class="uppercase font-black text-xs tracking-[0.5em]">SV Frohnstetten</p>
    </footer>

</body>
</html>
